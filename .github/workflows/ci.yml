name: CI

# Every push and pull request, on Windows and Linux (the core's ADR-0007). Markdown changes run too: the
# guides and skills are served at runtime, and their tests read the real files.
on:
  workflow_dispatch:
  push:
  pull_request:
    paths-ignore:
      - ".vscode/**"

permissions: {}

# Automatically cancel older in-progress jobs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: "npm"

      # Fetches the core from its GitHub tag and builds it (its prepare script, allowed in package.json).
      - name: Install dependencies
        run: npm ci

      - name: Test Unit
        run: npm run test

      - name: Test Types
        run: npm run test:types

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: "npm"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Build Package
        run: npm run build

      # The built server over real stdio: fails on anything but JSON-RPC frames on
      # stdout, which no unit test can see.
      - name: Smoke Test
        run: npm run smoke
        env:
          # No game on a runner. The server refuses to start without an instance, so it gets one
          # that does not exist: it starts, and healthcheck reports the instance unreadable.
          SKYRIM_MO2_INSTANCE: ${{ runner.temp }}/no-instance

      # The plugin helper, built for this system in the core's folder and started once: its
      # protocol, and a version read from a version resource, which on Linux is the helper's own parser.
      - name: Build Helper
        run: npm run build:helper

      - name: Check Helper
        run: npm run check:helper
